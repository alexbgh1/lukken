<div class="min-h-screen text-text-primary bg-bg-primary">
  <!-- Hero Section -->
  <section
    class="relative min-h-screen flex items-center justify-center overflow-hidden"
  >
    <!-- Animated background grid -->
    <div class="absolute inset-0 opacity-10">
      <div class="absolute inset-0 animate-float bg-grid-pattern"></div>
    </div>

    <!-- Blobs: accent, accent 2 and background colors  -->
    <div
      class="absolute w-192 h-192 rounded-full opacity-30 animate-pulse"
      style="
        top: 10%;
        left: 25%;
        background: radial-gradient(
          circle,
          oklch(65% 0.22 310 / 0.4) 0%,
          transparent 70%
        );
        animation-duration: 8s;
      "
    ></div>
    <div
      class="absolute w-120 h-120 rounded-full opacity-25 animate-pulse"
      style="
        bottom: 10%;
        right: 50%;
        background: radial-gradient(
          circle,
          oklch(55% 0.18 190 / 0.3) 0%,
          transparent 70%
        );
        animation-duration: 6s;
        animation-delay: 2s;
      "
    ></div>

    <div
      class="absolute w-64 h-64 rounded-full opacity-20 animate-pulse"
      style="
        top: 20%;
        left: 20%;
        background: radial-gradient(
          circle,
          oklch(35% 0.08 275 / 0.5) 0%,
          transparent 70%
        );
        animation-duration: 10s;
        animation-delay: 4s;
      "
    ></div>

    <div
      class="relative z-10 text-center max-w-4xl mx-auto px-6 transition-all duration-1000"
      [class.opacity-100]="isVisible"
      [class.translate-y-0]="isVisible"
      [class.opacity-0]="!isVisible"
      [class.translate-y-8]="!isVisible"
    >
      <div class="mb-8">
        <!-- <camera-icon
          class="w-16 h-16 mx-auto mb-6 text-accent-primary"
        ></camera-icon> -->
      </div>

      <h1
        class="text-5xl md:text-7xl font-bold mb-6 bg-gradient-to-r from-text-primary to-accent-primary bg-clip-text text-transparent"
      >
        NebulaPix
      </h1>

      <p class="text-xl md:text-2xl mb-8 max-w-2xl mx-auto text-text-secondary">
        Professional photography tools for pixel analysis, creative effects, and
        data visualization
      </p>

      <div class="flex flex-col sm:flex-row gap-4 justify-center mb-12">
        <button
          class="bg-accent-primary hover:bg-accent-secondary text-bg-primary font-semibold px-8 py-3 rounded-lg transition-all duration-300 transform hover:scale-105 flex items-center justify-center"
          (click)="scrollToSection('tools')"
        >
          Explore Tools
          <!-- <arrow-right-icon class="ml-2 w-5 h-5"></arrow-right-icon> -->
        </button>

        <button
          class="border border-border text-text-primary hover:bg-hover px-8 py-3 rounded-lg transition-all duration-300 bg-transparent"
        >
          View Documentation
        </button>
      </div>
    </div>
  </section>
</div>
