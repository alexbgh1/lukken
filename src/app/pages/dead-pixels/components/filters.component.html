<div
  class="flex flex-col gap-6 p-6 bg-bg-tertiary rounded-xl border border-border sm:min-w-sm max-w-md mx-auto"
>
  <form
    class="space-y-6"
    [formGroup]="canvasFiltersFormControl"
    (ngSubmit)="onSubmit()"
  >
    <!-- Image Upload with Drag and Drop -->
    <div class="space-y-1">
      <label
        class="block text-sm font-medium text-text-secondary"
        for="imageInput"
      >
        Image Upload
      </label>
      <div class="flex items-center gap-4">
        <label
          for="imageInput"
          class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-lg cursor-pointer transition-colors"
          [class.border-accent-primary]="isDragging"
          [class.border-gray-700]="!isDragging"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event)"
        >
          <div class="flex flex-col items-center justify-center pt-5 pb-6">
            <upload-icon
              className="{{
                isDragging ? 'text-accent-primary' : 'text-text-secondary'
              }}"
            ></upload-icon>

            <!-- Drag and Drop Instructions -->
            @if (!canvasFiltersFormControl.value.image) {
            <p
              class="mb-2 text-sm"
              [class.text-accent-primary]="isDragging"
              [class.text-text-muted]="!isDragging"
            >
              <span class="font-semibold">Click to upload</span> or drag and
              drop
            </p>
            }
            <!-- Image Name -->
            @if (canvasFiltersFormControl.value.image) {
            <p class="text-center text-xs text-text-muted">
              {{ canvasFiltersFormControl.value.image.name }}
            </p>
            }
          </div>
          <input
            id="imageInput"
            type="file"
            accept="image/*"
            (change)="onFileSelected($event)"
            class="hidden"
            [attr.accept]="FILE_CONFIG.ACCEPTED_TYPE.join(',')"
          />
        </label>
      </div>
    </div>

    <!-- Error Messages -->
    <div class="text-sm text-accent-primary space-y-1">
      <!-- error: file drop error -->
      @if (fileDropError) {
      <div>{{ fileDropError }}</div>
      }
    </div>

    <!-- Sensitivity Slider -->
    <div>
      <div class="flex justify-between items-center">
        <label
          for="sensitivity"
          class="block text-sm font-medium text-text-secondary"
        >
          Sensitivity
        </label>
        <span class="text-sm font-mono text-text-primary">
          {{ canvasFiltersFormControl.value.sensitivity }}
        </span>
      </div>
      <input
        id="sensitivity"
        type="range"
        [min]="SENSITIVITY.MIN"
        [max]="SENSITIVITY.MAX"
        step="1"
        formControlName="sensitivity"
        name="sensitivity"
        class="w-full h-2 bg-bg-secondary rounded-lg appearance-none cursor-pointer"
      />
      <p class="text-xs text-text-muted mt-1">
        Higher values detect more potential stuck pixels
      </p>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="!canvasFiltersFormControl.valid"
      class="w-full px-5 py-2.5 text-sm font-medium text-center text-text-primary bg-accent-primary rounded-lg hover:bg-accent-secondary transition-colors focus:ring-2 focus:outline-none focus:ring-accent-secondary disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Apply Changes
    </button>
  </form>
</div>
