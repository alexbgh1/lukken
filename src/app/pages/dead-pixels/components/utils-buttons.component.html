<div class="flex items-center justify-between mb-4">
  <h2 class="text-lg font-semibold text-text-primary">Canvas Controls</h2>
</div>

<!-- Utils Buttons -->
<div class="flex flex-wrap gap-3">
  <!-- Show/Hide Highlights Button -->
  <button
    class="inline-flex items-center gap-2 px-4 py-2.5 text-sm font-medium rounded-lg transition-all duration-200"
    [class.bg-accent-primary]="showHighlight()"
    [class.hover:bg-accent-secondary]="showHighlight()"
    [class.bg-bg-tertiary]="!showHighlight()"
    [class.text-text-primary]="!showHighlight()"
    [class.hover:bg-hover]="!showHighlight()"
    (click)="toggleHighlight()"
  >
    @if (showHighlight()) {
    <eye-icon className="w-4 h-4 text-text-primary" />
    } @else {
    <eye-off-icon className="w-4 h-4" />
    }
    {{ showHighlight() ? "Hide" : "Show" }} Highlights
  </button>

  <!-- Download Button -->
  <button
    class="inline-flex items-center gap-2 px-4 py-2.5 bg-bg-tertiary text-text-primary text-sm font-medium rounded-lg transition-all duration-200 hover:bg-hover"
    (click)="downloadCanvas()"
  >
    <download-icon className="w-4 h-4" />
    Download
  </button>

  <!-- Zoom View Button -->
  <button
    class="inline-flex items-center gap-2 px-4 py-2.5 bg-bg-tertiary text-text-primary text-sm font-medium rounded-lg transition-all duration-200 hover:bg-hover"
    (click)="openZoomModal()"
  >
    <zoom-in-icon className="w-4 h-4" />
    Zoom View
  </button>
</div>
